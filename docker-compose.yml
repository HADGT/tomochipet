version: "3.9"

services:
  qlthucung:
    image: ${DOCKER_USERNAME}/TomochiPet:latest
    container_name: qlthucung_web
    ports:
      - "8080:80"
    restart: always
    environment:
      - ASPNETCORE_URLS=http://+:80
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 60 qlthucung_web
