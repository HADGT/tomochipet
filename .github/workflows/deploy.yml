name: qlthucung ASP.NET Core + Docker

on:
  push:
    branches: [ master ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🧪 Build và test
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet test

      - name: 🐳 Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create Google credentials file
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          # Viết chính xác JSON (giữ newline) vào file và chỉ cho owner đọc
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          chmod 600 credentials.json
          # Optional: show first line to confirm (không xuất private key)
          head -n 1 credentials.json

      - name: 🔨 Build & Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/qlthucung:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/qlthucung:latest

      - name: Cleanup credentials file
        if: always()
        run: |
          shred -u credentials.json || rm -f credentials.json