name: qlthucung ASP.NET Core + Docker

on:
  push:
    branches: [ master ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🧪 Build và test
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet test

      - name: 🐳 Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔨 Build & Push Docker image
        run: |
          # Build using the repository root Dockerfile
          docker build -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/qlthucung:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/qlthucung:latest

      - name: 🔎 Optional smoke test (do not store creds in image)
        if: false
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          docker run -d --rm \
            -e "GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}" \
            -p 8080:80 \
            --name qlthucung_test \
            ${{ secrets.DOCKER_USERNAME }}/qlthucung:latest
          docker stop qlthucung_test || true